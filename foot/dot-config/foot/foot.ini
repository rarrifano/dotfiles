[main]
font=Hack:size=13,Noto Color Emoji:size=13
initial-window-size-pixels=1280x800
selection-target=both

# foot has no tabs/splits/window-navigation; only spawning a new terminal
# in the current cwd is supported (see key-bindings below).

[bell]
system=no
urgent=no
notify=no

[cursor]
style=block
color=1c1c1c fbf1c7
blink=yes

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[key-bindings]
fullscreen=F11
spawn-terminal=Control+Shift+Return
show-urls-launch=Control+Shift+o

[colors]
# retrobox colorscheme
background=1c1c1c
foreground=ebdbb2
selection-foreground=ebdbb2
selection-background=504945

regular0=1c1c1c
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984

bright0=928374
bright1=fb5944
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2
